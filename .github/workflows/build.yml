name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Qt${{ matrix.qt_major }} (${{ matrix.msvc_arch }})
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt_major: 5
            qt_version: '5.15.2'
            qt_arch: win32_msvc2019
            msvc_arch: x86
          - qt_major: 6
            qt_version: '6.8.3'
            qt_arch: win64_msvc2022_64
            msvc_arch: x64

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          cache: true
          cache-key-prefix: qlitemd-qt

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Show Qt
        shell: pwsh
        run: |
          Write-Output "::notice title=Qt root::$env:QT_ROOT_DIR"
          if (Test-Path "$env:QT_ROOT_DIR/lib/cmake") {
            Get-ChildItem "$env:QT_ROOT_DIR/lib/cmake" |
              Select-Object -ExpandProperty Name
          }

      - name: Configure
        shell: pwsh
        run: |
          $output = & cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DQLITEMD_QT_MAJOR=${{ matrix.qt_major }}" 2>&1 |
            Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $tail = ($output | Select-Object -Last 15) -join "%0A"
            Write-Output "::error title=CMake configure failed::$tail"
            exit $LASTEXITCODE
          }

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -L MARKDOWN

  linux:
    name: Linux Qt6 (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          install-deps: true
          cache: true
          cache-key-prefix: qlitemd-qt-linux

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DQLITEMD_QT_MAJOR=6
          -DQLITEMD_BUILD_MD_VIEWER=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -L MARKDOWN
