name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Qt${{ matrix.qt_major }} (${{ matrix.msvc_arch }}, resvg)
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt_major: 5
            qt_version: '5.15.2'
            qt_arch: win32_msvc2019
            msvc_arch: x86
          - qt_major: 6
            qt_version: '6.8.3'
            qt_arch: win64_msvc2022_64
            msvc_arch: x64

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          cache: true
          cache-key-prefix: qlitemd-qt

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Show Qt
        shell: pwsh
        run: |
          Write-Output "::notice title=Qt root::$env:QT_ROOT_DIR"
          if (Test-Path "$env:QT_ROOT_DIR/lib/cmake") {
            Get-ChildItem "$env:QT_ROOT_DIR/lib/cmake" |
              Select-Object -ExpandProperty Name
          }

      - name: Configure
        shell: pwsh
        run: |
          $output = & cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DQLITEMD_QT_MAJOR=${{ matrix.qt_major }}" `
            -DQLITEMD_SVG_BACKEND=resvg `
            -DQLITEMD_MERMAID_BACKEND=merman 2>&1 |
            Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $tail = ($output | Select-Object -Last 15) -join "%0A"
            Write-Output "::error title=CMake configure failed::$tail"
            exit $LASTEXITCODE
          }

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -L MARKDOWN

      - name: Install SDK
        shell: pwsh
        run: cmake --install build --prefix "$env:GITHUB_WORKSPACE/stage"

      - name: Build minimal consumer
        shell: pwsh
        run: |
          cmake -S examples/minimal -B consumer-build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE/stage;$env:QT_ROOT_DIR"
          cmake --build consumer-build

      - name: Run minimal consumer
        shell: pwsh
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\stage\bin;$env:QT_ROOT_DIR\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$env:QT_ROOT_DIR\plugins"
          .\consumer-build\qlitemd_minimal.exe

  linux:
    name: Linux Qt6 (x64, ${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: native
            backend_args: >-
              -DQLITEMD_SVG_BACKEND=resvg
              -DQLITEMD_FORMULA_BACKEND=ratex
              -DQLITEMD_MERMAID_BACKEND=merman
          - backend: quickjs
            backend_args: >-
              -DQLITEMD_SVG_BACKEND=qtsvg
              -DQLITEMD_FORMULA_BACKEND=quickjs
              -DQLITEMD_MERMAID_BACKEND=quickjs

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          install-deps: true
          cache: true
          cache-key-prefix: qlitemd-qt-linux

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DQLITEMD_QT_MAJOR=6
          -DQLITEMD_BUILD_MD_VIEWER=OFF
          ${{ matrix.backend_args }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -L MARKDOWN

      - name: Check formatting
        run: |
          python3 -m pip install --user --break-system-packages clang-format==21.1.2
          export PATH="$HOME/.local/bin:$PATH"
          git ls-files 'src/**/*.h' 'src/**/*.cpp' \
            'examples/**/*.h' 'examples/**/*.cpp' \
            'tests/**/*.h' 'tests/**/*.cpp' |
            xargs clang-format --dry-run --Werror

      - name: Install SDK
        run: cmake --install build --prefix "$GITHUB_WORKSPACE/stage"

      - name: Build minimal consumer
        run: |
          set -o pipefail
          ls -l "$GITHUB_WORKSPACE/stage/lib"
          if ! cmake -S examples/minimal -B consumer-build -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/stage;$QT_ROOT_DIR" \
              > consumer-configure.log 2>&1; then
            tail -n 40 consumer-configure.log
            msg=$(tail -n 20 consumer-configure.log | tr '\n' ' ')
            echo "::error title=consumer configure failed::$msg"
            exit 1
          fi
          if ! cmake --build consumer-build > consumer-build.log 2>&1; then
            tail -n 40 consumer-build.log
            msg=$(tail -n 20 consumer-build.log | tr '\n' ' ')
            echo "::error title=consumer build failed::$msg"
            exit 1
          fi

      - name: Run minimal consumer
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export QT_PLUGIN_PATH="$QT_ROOT_DIR/plugins"
          LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}" \
            ./consumer-build/qlitemd_minimal
